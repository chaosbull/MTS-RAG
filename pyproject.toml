[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-dynamic-control-framework"
version = "0.1.0"
description = "Hierarchical time-varying statistical control for industrial fermentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "chaosbull" },
]
urls = { Homepage = "https://github.com/chaosbull" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["udcf*"]
